<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Buku Kas IASS</title>
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    
    <style>
        :root {
            --bg-color: #F2F2F7; --card-bg: #FFFFFF; --iass-green: #057234;
            --iass-orange: #F78E1E; --text-main: #1C1C1E; --text-muted: #8E8E93;
            --border-color: #C6C6C8;
        }

        body { 
            font-family: -apple-system, BlinkMacSystemFont, sans-serif; 
            background-color: var(--bg-color); color: var(--text-main);
            margin: 0; padding: 0 0 70px 0; -webkit-font-smoothing: antialiased;
        }

        .container { max-width: 450px; margin: auto; padding: 0 15px; }
        
        #statusJaringan { 
            position: fixed; top: 15px; right: 15px; z-index: 1000;
            font-size: 11px; padding: 5px 10px; border-radius: 20px; font-weight: 600;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .status-online { background-color: #E5F3EB; color: var(--iass-green); }
        .status-offline { background-color: #FCECEB; color: #D73A49; }

        #btnLogout {
            position: fixed; top: 15px; left: 15px; z-index: 1000;
            font-size: 11px; padding: 5px 10px; border-radius: 20px; font-weight: 600;
            background-color: #FCECEB; color: #D73A49; border: none; box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            cursor: pointer; display: none;
        }

        .header { 
            position: sticky; top: 0; z-index: 100; text-align: center; 
            padding: 25px 0 15px 0; margin-bottom: 10px;
            background: linear-gradient(to bottom, rgba(242, 242, 247, 0.95) 75%, rgba(242, 242, 247, 0) 100%);
            backdrop-filter: blur(5px); -webkit-backdrop-filter: blur(5px);
        }
        .header-logo { width: 72%; max-width: 240px; height: auto; margin: 0 auto; display: block; }
        .header h2 { margin: 9px 0 0 0; font-weight: 600; color: var(--iass-green); font-size: 20px; letter-spacing: -0.2px; }

        /* --- DESAIN LOGIN BARU --- */
        .login-wrapper {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background-color: var(--iass-green);
            display: none; align-items: center; justify-content: center;
            z-index: 9999; padding: 20px; box-sizing: border-box;
        }
        .login-wrapper.active { display: flex; }
        
        .login-card {
            background: #FFFFFF; border-radius: 24px; padding: 35px 25px;
            width: 100%; max-width: 360px; text-align: center;
            box-shadow: 0 15px 35px rgba(0,0,0,0.2);
            animation: slideUpFade 0.5s ease-out;
        }
        
        @keyframes slideUpFade {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .login-logo { width: 85%; max-width: 220px; height: auto; margin-bottom: 20px; }
        .login-title { font-size: 22px; font-weight: 700; color: var(--text-main); margin: 0 0 5px 0; }
        .login-subtitle { font-size: 13px; color: var(--text-muted); margin-bottom: 30px; }
        
        .input-with-icon {
            display: flex; align-items: center; background: #F2F2F7;
            border-radius: 12px; margin-bottom: 15px; padding: 0 15px;
            border: 1px solid transparent; transition: 0.3s;
        }
        .input-with-icon:focus-within { border-color: var(--iass-green); background: #fff; box-shadow: 0 0 0 3px rgba(5, 114, 52, 0.1); }
        .input-with-icon svg { width: 20px; height: 20px; stroke: #8E8E93; fill: none; stroke-width: 2; margin-right: 12px; stroke-linecap: round; stroke-linejoin: round;}
        
        .login-input {
            flex: 1; border: none; background: transparent; padding: 15px 0;
            font-size: 15px; text-align: left; color: var(--text-main); outline: none; width: 100%;
        }
        .login-input::placeholder { color: #AEAEB2; }

        .btn-login {
            width: 100%; background: var(--iass-orange); color: white; border: none;
            border-radius: 12px; font-weight: 700; font-size: 15px; padding: 15px;
            cursor: pointer; margin-top: 15px; text-transform: uppercase; letter-spacing: 0.5px;
            box-shadow: 0 4px 12px rgba(247, 142, 30, 0.3); transition: 0.2s;
        }
        .btn-login:active { transform: scale(0.97); }
        .btn-login:disabled { opacity: 0.7; cursor: not-allowed; }
        /* ------------------------- */

        .custom-select-trigger {
            width: 100%; padding: 13px 14px; font-size: 14px;
            border: 1px solid rgba(198,198,200,0.75);
            border-radius: 13px; background-color: rgba(255,255,255,0.92);
            color: var(--text-main); margin-bottom: 12px; font-weight: 600;
            cursor: pointer; text-align: left; display: flex;
            justify-content: space-between; align-items: center; box-sizing: border-box;
            box-shadow: 0 1px 2px rgba(0,0,0,0.02);
        }
        .custom-select-trigger::after {
            content: "";
            width: 8px; height: 8px;
            border-right: 1.8px solid var(--text-muted);
            border-bottom: 1.8px solid var(--text-muted);
            transform: rotate(45deg) translateY(-2px);
            margin-left: 12px; flex: 0 0 8px;
            transition: transform 0.2s ease;
        }
        .custom-select-trigger:active::after {
            transform: rotate(45deg) translateY(0) scale(0.92);
        }

        .card {
            background-color: var(--card-bg); border-radius: 16px; overflow: hidden;
            margin-bottom: 18px; box-shadow: 0 2px 8px rgba(0,0,0,0.035);
        }
        .form-row {
            display: flex; align-items: center; padding: 16px 15px;
            min-height: 58px; border-bottom: 1px solid rgba(198,198,200,0.45);
            box-sizing: border-box;
        }
        .form-row:last-child { border-bottom: none; }
        .form-row label { width: 35%; font-size: 14px; font-weight: 500; color: var(--text-main); }
        .form-input-container { width: 65%; display: flex; flex-direction: column; }
        
        input[type="text"], input[type="password"] {
            width: 100%; border: none; font-size: 15px; outline: none; text-align: right; background: transparent; color: var(--text-main);
        }
        
        .radio-group { display: flex; justify-content: flex-end; gap: 7px; }
        .radio-group label {
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; font-size: 13px; font-weight: 500;
            padding: 8px 12px; border: 1px solid var(--border-color);
            border-radius: 10px; background: #F7F7F9; color: var(--text-muted);
            transition: all .18s ease;
        }
        .radio-group input[type="radio"] {
            appearance: none; width: 0; height: 0; margin: 0;
        }
        .radio-group label:has(input:checked) {
            background: #E5F3EB; border-color: var(--iass-green);
            color: var(--iass-green); font-weight: 600;
        }
        button.btn-primary {
            width: 100%; background-color: var(--iass-orange); color: white;
            border: none; border-radius: 14px; font-weight: 600;
            font-size: 16px; padding: 14px; cursor: pointer;
            box-shadow: 0 4px 10px rgba(242,145,18,0.14);
        }
        button.btn-primary:active { transform: scale(0.99); }
        button.btn-primary:disabled { opacity: 0.6; }

        .summary-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 18px; }
        .summary-box {
            background: var(--card-bg); padding: 14px 15px; border-radius: 14px;
            text-align: center; box-shadow: none;
        }
        .summary-box.full {
            grid-column: span 2; background-color: var(--iass-green); color: white;
            border-radius: 16px; box-shadow: 0 4px 12px rgba(5,114,52,0.10);
            padding: 15px;
        }
        .summary-box p { margin: 0; font-size: 11px; color: var(--text-muted); }
        .summary-box.full p { color: #DDF1E5; }
        .summary-box h3 { margin: 5px 0 0 0; font-size: 17px; }
        .text-masuk { color: var(--iass-green); }
        .text-keluar { color: #D73A49; }

        .history-item {
            padding: 15px 8px;
            border-bottom: 1px solid rgba(198,198,200,0.45);
            display: flex; justify-content: space-between; align-items: center;
            background: var(--card-bg); min-height: 62px; box-sizing: border-box;
        }
        .history-item:first-child { border-radius: 12px 12px 0 0; }
        .history-item:last-child { border-bottom: none; border-radius: 0 0 12px 12px; }
        .history-info { min-width: 0; padding-right: 10px; }
        .history-info p {
            margin: 0 0 4px 0; font-size: 14px; font-weight: 500;
            text-transform: capitalize; line-height: 1.25;
        }
        .history-info small { color: var(--text-muted); font-size: 11px; }
        .history-amount { font-weight: 600; font-size: 14px; white-space: nowrap; }

        .history-edit-btn {
            width: 30px; height: 30px; margin-left: 8px; flex: 0 0 30px;
            border: none; background: transparent; color: var(--iass-green);
            border-radius: 50%; font-size: 0;
            display: inline-flex; align-items: center; justify-content: center;
            cursor: pointer; padding: 0;
        }
        .history-edit-btn svg { width: 17px; height: 17px; stroke: currentColor; }
        .history-edit-btn:active { background: #E5F3EB; transform: scale(0.94); }

        .edit-modal-header {
            position: relative; display: flex; align-items: center;
            justify-content: center; min-height: 34px; margin-bottom: 12px;
        }
        .edit-modal-header .modal-title { margin: 0; }
        .modal-delete-btn {
            position: absolute; right: 0; top: 0; width: 34px; height: 34px;
            border: none; background: transparent; color: #D73A49;
            border-radius: 50%; display: inline-flex; align-items: center;
            justify-content: center; cursor: pointer; padding: 0;
        }
        .modal-delete-btn svg { width: 18px; height: 18px; stroke: currentColor; }

        .modal-delete-btn:active { transform: scale(0.94); }

        .confirm-overlay {
            position: fixed; inset: 0; z-index: 2000;
            display: none; align-items: center; justify-content: center;
            padding: 22px; box-sizing: border-box;
            background: rgba(0,0,0,0.42);
            backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px);
        }
        .confirm-card {
            width: 100%; max-width: 360px; box-sizing: border-box;
            background: var(--card-bg); border-radius: 22px;
            padding: 24px 22px 18px;
            box-shadow: 0 18px 45px rgba(0,0,0,0.18);
            animation: confirmPop 0.18s ease-out;
        }
        @keyframes confirmPop {
            from { opacity: 0; transform: scale(0.96) translateY(8px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }
        .confirm-icon {
            width: 44px; height: 44px; margin: 0 auto 13px;
            border-radius: 50%; background: #FCECEB; color: #D73A49;
            display: flex; align-items: center; justify-content: center;
        }
        .confirm-icon svg { width: 21px; height: 21px; stroke: currentColor; }
        .confirm-title {
            margin: 0; text-align: center; font-size: 18px;
            font-weight: 650; color: var(--text-main);
        }
        .confirm-message {
            margin: 9px 0 20px; text-align: center;
            color: var(--text-muted); font-size: 13px; line-height: 1.5;
            white-space: pre-line;
        }
        .confirm-actions { display: flex; gap: 9px; }
        .confirm-actions button {
            flex: 1; border-radius: 12px; padding: 12px;
            font-size: 14px; font-weight: 600; cursor: pointer;
        }
        .confirm-cancel {
            border: 1px solid var(--border-color);
            background: #F7F7F9; color: var(--text-main);
        }
        .confirm-danger {
            border: none; background: #D73A49; color: white;
        }
        .confirm-actions button:active { transform: scale(0.98); }

        .app-toast {
            position: fixed; left: 50%; bottom: 82px; z-index: 2500;
            transform: translate(-50%, 14px);
            min-width: 220px; max-width: calc(100vw - 40px);
            padding: 12px 16px; border-radius: 14px;
            background: rgba(35,35,35,0.94); color: #fff;
            font-size: 13px; line-height: 1.35; text-align: center;
            box-shadow: 0 8px 24px rgba(0,0,0,0.18);
            opacity: 0; pointer-events: none;
            transition: opacity .2s ease, transform .2s ease;
            box-sizing: border-box;
        }
        .app-toast.show { opacity: 1; transform: translate(-50%, 0); }
        .app-toast.success { background: #087A3B; }
        .app-toast.error { background: #B83243; }

        .bottom-nav {
            position: fixed; bottom: 0; left: 0; right: 0; background: var(--card-bg);
            display: flex; border-top: 1px solid var(--border-color); padding-bottom: env(safe-area-inset-bottom); z-index: 100;
        }
        .nav-item {
            flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
            padding: 10px 0; color: var(--text-muted); font-size: 11px; font-weight: 500; cursor: pointer;
        }
        .nav-icon { width: 22px; height: 22px; margin-bottom: 4px; stroke: var(--text-muted); }
        .nav-item.active { color: var(--iass-green); }
        .nav-item.active .nav-icon { stroke: var(--iass-green); }

        .view-section { display: none; }
        .view-section.active { display: block; }

        .modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.4); z-index: 999; display: none; align-items: flex-end; justify-content: center; }
        .modal-sheet { background: var(--card-bg); width: 100%; max-width: 450px; border-radius: 20px 20px 0 0; padding: 20px; box-sizing: border-box; animation: slideUp 0.3s ease-out; max-height: 80vh; overflow-y: auto; }
        @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
        .modal-title { font-size: 16px; font-weight: 600; text-align: center; margin-bottom: 15px; color: var(--text-main); }
        .modal-option { padding: 15px; border-bottom: 1px solid var(--border-color); font-size: 15px; text-align: center; cursor: pointer; }
        .modal-option:last-child { border-bottom: none; }
        .modal-option:active { background-color: var(--bg-color); }
        
        .calendar-backdrop {
            position: fixed; inset: 0; z-index: 2998;
            display: none; background: rgba(15,18,16,0.56);
            backdrop-filter: blur(2px); -webkit-backdrop-filter: blur(2px);
        }
        .calendar-backdrop.show { display: block; }
        .flatpickr-calendar {
            font-family: inherit !important;
            border-radius: 20px !important;
            box-shadow: 0 18px 50px rgba(0,0,0,0.22) !important;
            border: none !important;
            width: calc(100vw - 40px) !important;
            max-width: 360px !important;
            padding: 8px !important;
            z-index: 2999 !important;
        }
        .flatpickr-calendar.open {
            position: fixed !important;
            top: 50% !important; left: 50% !important;
            transform: translate(-50%, -50%) !important;
            margin: 0 !important;
        }
        .flatpickr-day.selected {
            background: var(--iass-green) !important;
            border-color: var(--iass-green) !important;
        }
        .flatpickr-day.today:not(.selected) {
            border-color: var(--iass-green) !important;
        }
        .flatpickr-current-month { font-size: 17px !important; }
        .flatpickr-weekdays { margin-top: 4px; }
        .flatpickr-weekday { color: var(--text-muted) !important; }
        .flatpickr-months .flatpickr-month { height: 42px !important; }
        .flatpickr-prev-month, .flatpickr-next-month { top: 10px !important; }
        .flatpickr-day { border-radius: 50% !important; }
    </style>
</head>
<body>
    <div id="statusJaringan" class="status-online">Online</div>
    <div id="calendarBackdrop" class="calendar-backdrop" onclick="dateInput.close()"></div>
    <button id="btnLogout" onclick="logout()">Keluar</button>

    <!-- VIEW: LOGIN (Tampilan overlay hijau penuh) -->
    <div id="viewLogin" class="login-wrapper active">
        <div class="login-card">
            <img src="logo.png" alt="Logo IASS" class="login-logo">
            <h2 class="login-title">Selamat Datang</h2>
            <p class="login-subtitle">Silakan masuk menggunakan identitas Anda</p>
            
            <div class="input-with-icon">
                <svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
                <input type="text" id="loginUser" class="login-input" placeholder="ID Pengurus atau Username" autocomplete="off">
            </div>
            
            <div class="input-with-icon">
                <svg viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
                <input type="password" id="loginPass" class="login-input" placeholder="PIN Rahasia">
            </div>
            
            <button onclick="doLogin()" class="btn-login" id="btnProsesLogin">Masuk Aplikasi</button>
        </div>
    </div>

    <!-- AREA APLIKASI UTAMA -->
    <div class="container">
        <div class="header">
            <img src="logo.png" alt="Logo IASS" class="header-logo">
            <h2 id="pageTitle">Sistem Kas IASS</h2>
            <p id="welcomeMsg" style="font-size:12px; color:var(--text-muted); margin-top:5px; display:none;"></p>
        </div>

        <!-- VIEW: INPUT TRANSAKSI -->
        <div id="viewInput" class="view-section">
            <div id="trigger_cat_in" class="custom-select-trigger" onclick="openModal('cat_in', 'Pilih Kategori Kas')">Buku Kas PW</div>
            <input type="hidden" id="cat_in" value="KAS PW">

            <form id="kasForm">
                <div class="card">
                    <div class="form-row">
                        <label>Tanggal</label>
                        <div class="form-input-container">
                            <input type="text" id="tanggal" required placeholder="Pilih Tanggal">
                            <span id="hijriInfo" style="font-size:12px; color:var(--iass-green); text-align:right; margin-top:4px;"></span>
                        </div>
                    </div>
                    <div class="form-row">
                        <label>Uraian</label>
                        <div class="form-input-container">
                            <input type="text" id="uraian" required placeholder="Contoh: Beli ATK">
                        </div>
                    </div>
                    <div class="form-row">
                        <label>Jenis</label>
                        <div class="form-input-container">
                            <div class="radio-group">
                                <label><input type="radio" name="jenis" value="masuk" required> Masuk</label>
                                <label><input type="radio" name="jenis" value="keluar"> Keluar</label>
                            </div>
                        </div>
                    </div>
                    <div class="form-row">
                        <label>Nominal</label>
                        <div class="form-input-container">
                            <input type="text" id="nominal" required placeholder="0" inputmode="numeric">
                        </div>
                    </div>
                </div>
                <button type="submit" class="btn-primary" id="btnSimpan">Simpan Transaksi</button>
            </form>
        </div>

        <!-- VIEW: RIWAYAT & RINGKASAN -->
        <div id="viewRiwayat" class="view-section">
            <div id="trigger_cat_out" class="custom-select-trigger" onclick="openModal('cat_out', 'Lihat Laporan Kas')">Lihat: Kas PW</div>
            <input type="hidden" id="cat_out" value="KAS PW">

            <!-- Dropdown Bulan Dinamis -->
            <div id="wrapper_bulanSheet">
                <div id="trigger_bulanSheet" class="custom-select-trigger" onclick="openModal('bulanSheet', 'Pilih Bulan')">Memuat bulan...</div>
                <input type="hidden" id="bulanSheet" value="">
            </div>

            <div class="summary-grid">
                <div class="summary-box full">
                    <p>Total Saldo Akhir</p>
                    <h3 id="sumSaldo">Rp 0</h3>
                </div>
                <div class="summary-box">
                    <p>Pemasukan</p>
                    <h3 id="sumMasuk" class="text-masuk">Rp 0</h3>
                </div>
                <div class="summary-box">
                    <p>Pengeluaran</p>
                    <h3 id="sumKeluar" class="text-keluar">Rp 0</h3>
                </div>
            </div>

            <div id="historyList" style="border-radius:14px; box-shadow:0 1px 2px rgba(0,0,0,0.03); margin-bottom:20px; overflow:hidden;">
                <div style="padding:20px; text-align:center; color:gray; font-size:14px; background:white; border-radius:12px;">Memuat data...</div>
            </div>
        </div>
    </div>

    <!-- Navigasi Bawah -->
    <div class="bottom-nav" id="bottomNav" style="display:none;">
        <div class="nav-item active" id="navInputBtn" onclick="switchTab('input')">
            <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path>
                <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path>
            </svg>
            Input
        </div>
        <div class="nav-item" id="navRiwayatBtn" onclick="switchTab('riwayat')">
            <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="10"></circle>
                <polyline points="12 6 12 12 16 14"></polyline>
            </svg>
            Riwayat
        </div>
    </div>

    <!-- Modal Edit Transaksi -->
    <div class="modal-overlay" id="editModal" onclick="closeEditModal(event)">
        <div class="modal-sheet" style="max-height:90vh;">
            <div class="edit-modal-header">
                <div class="modal-title">Detail Transaksi</div>
                <button type="button" class="modal-delete-btn" id="btnDeleteFromEdit" aria-label="Hapus transaksi" title="Hapus transaksi"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h18"></path><path d="M8 6V4h8v2"></path><path d="M19 6l-1 14H6L5 6"></path><path d="M10 10v6"></path><path d="M14 10v6"></path></svg></button>
            </div>
            <form id="editForm">
                <input type="hidden" id="editRow"><input type="hidden" id="editSheet"><input type="hidden" id="editKategori">
                <div class="card">
                    <div class="form-row"><label>Tanggal</label><div class="form-input-container"><input type="text" id="editTanggal" required placeholder="Tanggal transaksi"><small style="font-size:11px;color:var(--text-muted);text-align:right;margin-top:4px;" id="editTanggalHint"></small></div></div>
                    <div class="form-row"><label>Uraian</label><div class="form-input-container"><input type="text" id="editUraian" required placeholder="Uraian"></div></div>
                    <div class="form-row"><label>Jenis</label><div class="form-input-container"><div class="radio-group"><label><input type="radio" name="editJenis" value="masuk" required> Masuk</label><label><input type="radio" name="editJenis" value="keluar"> Keluar</label></div></div></div>
                    <div class="form-row"><label>Nominal</label><div class="form-input-container"><input type="text" id="editNominal" required inputmode="numeric" placeholder="0"></div></div>
                </div>
                <button type="submit" class="btn-primary" id="btnUpdate">Simpan Perubahan</button>
            </form>
        </div>
    </div>

    <div class="app-toast" id="appToast"></div>

    <!-- Modal Konfirmasi Hapus -->
    <div class="confirm-overlay" id="confirmDeleteModal" onclick="closeConfirmDelete(event)">
        <div class="confirm-card">
            <div class="confirm-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M3 6h18"></path>
                    <path d="M8 6V4h8v2"></path>
                    <path d="M19 6l-1 14H6L5 6"></path>
                    <path d="M10 10v6"></path>
                    <path d="M14 10v6"></path>
                </svg>
            </div>
            <h3 class="confirm-title">Hapus Transaksi?</h3>
            <div class="confirm-message" id="confirmDeleteMessage"></div>
            <div class="confirm-actions">
                <button type="button" class="confirm-cancel" onclick="closeConfirmDelete()">Batal</button>
                <button type="button" class="confirm-danger" id="btnConfirmDelete">Hapus</button>
            </div>
        </div>
    </div>

    <!-- Modal Bottom Sheet -->
    <div class="modal-overlay" id="customModal" onclick="closeModal(event)">
        <div class="modal-sheet">
            <div class="modal-title" id="modalTitle">Pilih</div>
            <div id="modalOptions"></div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    <script src="https://cdn.jsdelivr.net/npm/flatpickr/dist/l10n/id.js"></script>

    <script>
        const URL_APPS_SCRIPT = 'https://script.google.com/macros/s/AKfycbyZlyYAVIB3U9jV3BLZOLUS0bXyQaif0pW5v1kfqtmQ73-SREo-b_xFZPlWapuoPbhJtA/exec';
        let tanggalHijriyahFinal = ""; let rawHistoryData = []; let backendSummary = {};

        let toastTimer = null;
        function showToast(message, type='success') {
            const toast = document.getElementById('appToast');
            if(!toast) return;
            clearTimeout(toastTimer);
            toast.textContent = message;
            toast.className = 'app-toast show ' + type;
            toastTimer = setTimeout(()=>{ toast.className='app-toast'; }, 2400);
        }

        function checkSession() {
            const role = localStorage.getItem('iassRole'); const nama = localStorage.getItem('iassNama');
            if (role) {
                // Tembunyikan area login
                document.getElementById('viewLogin').classList.remove('active');
                
                document.getElementById('btnLogout').style.display = 'block';
                document.getElementById('bottomNav').style.display = 'flex';
                document.getElementById('welcomeMsg').style.display = 'block';
                document.getElementById('welcomeMsg').textContent = `Halo, ${toProperCase(nama)} (${role})`;
                
                if (role.toLowerCase() === 'bendahara') { document.getElementById('navInputBtn').style.display = 'flex'; switchTab('input'); } 
                else { document.getElementById('navInputBtn').style.display = 'none'; switchTab('riwayat'); }
            } else {
                // Tampilkan area login overlay
                document.getElementById('viewLogin').classList.add('active');
                
                document.getElementById('btnLogout').style.display = 'none'; document.getElementById('bottomNav').style.display = 'none';
                document.getElementById('welcomeMsg').style.display = 'none';
                document.querySelectorAll('.view-section').forEach(el => el.classList.remove('active'));
            }
        }

        function doLogin() {
            const user = document.getElementById('loginUser').value; const pass = document.getElementById('loginPass').value;
            if(!user || !pass) return alert("Isi Username dan Password!");
            const btn = document.getElementById('btnProsesLogin'); btn.textContent = "Mengecek Akun..."; btn.disabled = true;

            fetch(URL_APPS_SCRIPT, { method: 'POST', body: JSON.stringify({ action: 'login', username: user, password: pass }), headers: { 'Content-Type': 'text/plain;charset=utf-8' } })
            .then(res => res.json())
            .then(res => {
                if (res.status === 'success') {
                    localStorage.setItem('iassRole', res.role); localStorage.setItem('iassNama', res.nama);
                    document.getElementById('loginUser').value = ""; document.getElementById('loginPass').value = ""; checkSession();
                } else { alert(res.message); }
            })
            .catch(() => alert('Gagal terhubung. Pastikan ada sinyal internet.'))
            .finally(() => { btn.textContent = "Masuk Aplikasi"; btn.disabled = false; });
        }
        
        function logout() { if(confirm("Yakin ingin keluar?")) { localStorage.removeItem('iassRole'); localStorage.removeItem('iassNama'); setBulanHijriyahOtomatis();
        checkSession(); } }

        const flatpickrConfig = { locale: "id", dateFormat: "Y-m-d", altInput: true, altFormat: "j F Y", disableMobile: "true", appendTo: document.body };
        const dateInput = flatpickr("#tanggal", {
            ...flatpickrConfig,
            onOpen: function() {
                document.getElementById('calendarBackdrop').classList.add('show');
            },
            onClose: function() {
                document.getElementById('calendarBackdrop').classList.remove('show');
            },
            onChange: function(selectedDates, dateStr) {
                tanggalHijriyahFinal = dateStr ? convertToHijri(dateStr) : "";
                if(document.getElementById('cat_in').value === 'KAS PW') { document.getElementById('hijriInfo').textContent = tanggalHijriyahFinal ? `Hijriyah: ${tanggalHijriyahFinal}` : ""; }
            }
        });

        const formatRp = (angka) => new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', minimumFractionDigits: 0 }).format(angka || 0);
        document.getElementById('nominal').addEventListener('input', function() {
            let val = this.value.replace(/\D/g, ''); this.value = val ? new Intl.NumberFormat('id-ID').format(val) : '';
        });
        function toProperCase(str) { return str.toLowerCase().replace(/\b\w/g, s => s.toUpperCase()); }
        function convertToHijri(dateStr) {
            try {
                const date = new Date(dateStr);
                const formatter = new Intl.DateTimeFormat('en-US-u-ca-islamic-umalqura', { day: '2-digit', month: '2-digit', year: 'numeric' });
                const parts = formatter.formatToParts(date);
                return `${parts.find(p => p.type === 'day').value}/${parts.find(p => p.type === 'month').value}/${parts.find(p => p.type === 'year').value.match(/\d+/)[0]}`;
            } catch (err) { return ""; }
        }

        const bulanHijriyah = [
            { val: '1/48', label: 'Bulan 1 (Muharram 1448)' }, { val: '2/48', label: 'Bulan 2 (Shafar 1448)' }, { val: '3/48', label: 'Bulan 3 (R. Awal 1448)' },
            { val: '4/48', label: 'Bulan 4 (R. Tsani 1448)' }, { val: '5/48', label: 'Bulan 5 (J. Ula 1448)' }, { val: '6/48', label: 'Bulan 6 (J. Tsani 1448)' },
            { val: '7/48', label: 'Bulan 7 (Rajab 1448)' }, { val: '8/48', label: 'Bulan 8 (Sya\'ban 1448)' }, { val: '9/48', label: 'Bulan 9 (Ramadhan 1448)' },
            { val: '10/48', label: 'Bulan 10 (Syawal 1448)' }, { val: '11/48', label: 'Bulan 11 (Dzul Qo\'dah 1448)' }, { val: '12/48', label: 'Bulan 12 (Dzul Hijjah 1448)' }
        ];

        function setBulanHijriyahOtomatis() {
            try {
                const today = new Date();
                const formatter = new Intl.DateTimeFormat('en-US-u-ca-islamic-umalqura', { month: 'numeric', year: 'numeric' });
                const parts = formatter.formatToParts(today);
                const hijriMonth = Number(parts.find(p => p.type === 'month')?.value);
                const hijriYear = Number(parts.find(p => p.type === 'year')?.value);
                if (!hijriMonth || !hijriYear) return;

                const targetValue = hijriMonth + '/' + String(hijriYear).slice(-2);
                const found = bulanHijriyah.find(item => item.val === targetValue);

                if (found) {
                    document.getElementById('bulanSheet').value = found.val;
                    document.getElementById('trigger_bulanSheet').textContent = found.label;
                } else {
                    document.getElementById('bulanSheet').value = targetValue;
                    document.getElementById('trigger_bulanSheet').textContent = 'Bulan Hijriyah saat ini';
                }
            } catch (err) {
                console.warn('Gagal menentukan bulan Hijriyah otomatis:', err);
                document.getElementById('bulanSheet').value = bulanHijriyah[0].val;
                document.getElementById('trigger_bulanSheet').textContent = bulanHijriyah[0].label;
            }
        }

        const bulanMasehi = [
            { val: 'ALL', label: 'Tampilkan Semua' },
            { val: '5/2026', label: 'Mei 2026' }, { val: '6/2026', label: 'Juni 2026' }, { val: '7/2026', label: 'Juli 2026' },
            { val: '8/2026', label: 'Agustus 2026' }, { val: '9/2026', label: 'September 2026' }, { val: '10/2026', label: 'Oktober 2026' },
            { val: '11/2026', label: 'November 2026' }, { val: '12/2026', label: 'Desember 2026' }, { val: '1/2027', label: 'Januari 2027' }
        ];

        let optionsData = {
            'cat_in': [ { val: 'KAS PW', label: 'BUKU KAS OPRASIONAL' }, { val: 'KAS MOBIL', label: 'BUKU KAS ARMADA' } ],
            'cat_out': [ { val: 'KAS PW', label: 'KAS OPRASIONAL' }, { val: 'KAS MOBIL', label: 'KAS ARMADA' }, { val: 'KAS PW & MOBIL', label: 'KAS OPRASIONAL & ARMADA (GABUNGAN)' } ],
            'bulanSheet': bulanHijriyah
        };

        function adaptParadoxUI() {
            // Untuk KAS PW, selalu gunakan bulan Hijriyah yang sedang berjalan
            if (document.getElementById('cat_out').value === 'KAS PW' && !document.getElementById('bulanSheet').value) {
                setBulanHijriyahOtomatis();
            }
            if(document.getElementById('cat_in').value === 'KAS MOBIL') { document.getElementById('hijriInfo').style.display = 'none'; } 
            else { document.getElementById('hijriInfo').style.display = 'block'; if(tanggalHijriyahFinal) document.getElementById('hijriInfo').textContent = `Hijriyah: ${tanggalHijriyahFinal}`; }

            const catOut = document.getElementById('cat_out').value;
            const wrapperBulan = document.getElementById('wrapper_bulanSheet');
            const triggerBulan = document.getElementById('trigger_bulanSheet');

            if (catOut === 'KAS MOBIL') {
                wrapperBulan.style.display = 'block';
                optionsData['bulanSheet'] = bulanMasehi;
                if(!document.getElementById('bulanSheet').value.includes('/20') && document.getElementById('bulanSheet').value !== 'ALL') {
                    document.getElementById('bulanSheet').value = 'ALL';
                    triggerBulan.textContent = 'Tampilkan Semua';
                }
            } else if (catOut === 'KAS PW & MOBIL') {
                // Kas gabungan membutuhkan sheet PW bulan berjalan + Kas Armada.
                // Pastikan targetSheet tidak masih menunjuk ke "ALL" dari Kas Armada.
                wrapperBulan.style.display = 'none';
                if (document.getElementById('bulanSheet').value.includes('/20') || document.getElementById('bulanSheet').value === 'ALL' || !document.getElementById('bulanSheet').value) {
                    setBulanHijriyahOtomatis();
                }
            } else {
                wrapperBulan.style.display = 'block';
                optionsData['bulanSheet'] = bulanHijriyah;
                if(document.getElementById('bulanSheet').value.includes('/20') || document.getElementById('bulanSheet').value === 'ALL') {
                    setBulanHijriyahOtomatis();
                }
            }
        }

        function openModal(targetId, title) {
            const modal = document.getElementById('customModal'); document.getElementById('modalTitle').textContent = title;
            const optionsContainer = document.getElementById('modalOptions'); optionsContainer.innerHTML = '';
            optionsData[targetId].forEach(opt => {
                let div = document.createElement('div'); div.className = 'modal-option'; div.textContent = opt.label;
                div.onclick = function() {
                    document.getElementById(targetId).value = opt.val; document.getElementById('trigger_' + targetId).textContent = opt.label;
                    modal.style.display = 'none'; adaptParadoxUI();
                    if(targetId === 'cat_out' || targetId === 'bulanSheet') fetchData();
                };
                optionsContainer.appendChild(div);
            });
            modal.style.display = 'flex';
        }
        function closeModal(e) { if(e.target === document.getElementById('customModal')) document.getElementById('customModal').style.display = 'none'; }

        function switchTab(tab) {
            document.querySelectorAll('.view-section').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
            
            if(tab === 'input') {
                document.getElementById('viewInput').classList.add('active'); document.getElementById('navInputBtn').classList.add('active');
                document.getElementById('pageTitle').textContent = "Input Kas";
                let currentOut = document.getElementById('cat_out').value;
                if(currentOut === 'KAS PW & MOBIL') {
                    document.getElementById('cat_in').value = 'KAS PW'; document.getElementById('trigger_cat_in').textContent = 'BUKU KAS OPRASIONAL';
                } else {
                    document.getElementById('cat_in').value = currentOut; document.getElementById('trigger_cat_in').textContent = optionsData.cat_in.find(o => o.val === currentOut).label;
                }
            } else {
                document.getElementById('viewRiwayat').classList.add('active'); document.getElementById('navRiwayatBtn').classList.add('active');
                document.getElementById('pageTitle').textContent = "Riwayat & Ringkasan";
                let inVal = document.getElementById('cat_in').value; document.getElementById('cat_out').value = inVal;
                document.getElementById('trigger_cat_out').textContent = optionsData.cat_out.find(o => o.val === inVal).label;
            }
            adaptParadoxUI();
            if (tab === 'riwayat') fetchData();
            window.scrollTo(0, 0); 
        }

        function fetchData() {
            if(!navigator.onLine) { document.getElementById('historyList').innerHTML = '<div style="padding:20px; text-align:center; color:red; font-size:14px; background:white; border-radius:12px;">Anda sedang offline.</div>'; return; }
            document.getElementById('historyList').innerHTML = '<div style="padding:20px; text-align:center; color:gray; font-size:14px; background:white; border-radius:12px;">Mengambil data...</div>';
            
            const reqData = { action: 'getData', kategori: document.getElementById('cat_out').value, targetSheet: document.getElementById('bulanSheet').value };
            fetch(URL_APPS_SCRIPT, { method: 'POST', body: JSON.stringify(reqData), headers: { 'Content-Type': 'text/plain;charset=utf-8' } })
            .then(res => res.json())
            .then(result => {
                if(result.status === 'success') {
                    backendSummary = result.summary; rawHistoryData = result.history; renderHistory();
                } else { document.getElementById('historyList').innerHTML = `<div style="padding:20px; text-align:center; color:red; font-size:14px; background:white; border-radius:12px;">${result.message}</div>`; }
            }).catch(e => { document.getElementById('historyList').innerHTML = '<div style="padding:20px; text-align:center; color:red; font-size:14px; background:white; border-radius:12px;">Gagal terhubung.</div>'; });
        }

        function renderHistory() {
            const listContainer = document.getElementById('historyList'); listContainer.innerHTML = '';
            const catOut = document.getElementById('cat_out').value;
            let filteredData = rawHistoryData;

            if (catOut === 'KAS MOBIL') {
                const filterMasehi = document.getElementById('bulanSheet').value;
                if (filterMasehi !== 'ALL') {
                    let [fMonth, fYear] = filterMasehi.split('/');
                    filteredData = rawHistoryData.filter(item => {
                        let d = new Date(item.tanggal);
                        if(isNaN(d)) return false;
                        return (d.getMonth()+1)==parseInt(fMonth) && d.getFullYear()==parseInt(fYear);
                    });
                } else filteredData = rawHistoryData.filter(item => !isNaN(new Date(item.tanggal)));

                let mIn=0,mOut=0,mSaldo=0;
                filteredData.forEach(item => { mIn += Number(item.masuk)||0; mOut += Number(item.keluar)||0; });
                if(filterMasehi==='ALL') { mSaldo=backendSummary.saldo; if(!mSaldo&&filteredData.length) mSaldo=filteredData[filteredData.length-1].saldo; }
                else if(filteredData.length) mSaldo=filteredData[filteredData.length-1].saldo;
                document.getElementById('sumMasuk').textContent=formatRp(mIn);
                document.getElementById('sumKeluar').textContent=formatRp(mOut);
                document.getElementById('sumSaldo').textContent=formatRp(mSaldo);
            } else {
                document.getElementById('sumMasuk').textContent=formatRp(backendSummary.pemasukan);
                document.getElementById('sumKeluar').textContent=formatRp(backendSummary.pengeluaran);
                document.getElementById('sumSaldo').textContent=formatRp(backendSummary.saldo);
            }

            if(catOut!=='KAS PW & MOBIL') {
                filteredData.sort((a,b)=>{
                    if(catOut==='KAS MOBIL') return new Date(b.tanggal)-new Date(a.tanggal);
                    return a.tanggal.split('/').reverse().join('').localeCompare(b.tanggal.split('/').reverse().join(''));
                });
            }

            if(!filteredData.length) {
                listContainer.innerHTML='<div style="padding:20px;text-align:center;color:gray;font-size:14px;background:white;border-radius:12px;">Tidak ada transaksi di bulan ini.</div>';
                return;
            }

            const isBendahara=(localStorage.getItem('iassRole')||'').toLowerCase()==='bendahara';
            filteredData.reverse().forEach(item=>{
                const isMasuk=Number(item.masuk)>0, amount=isMasuk?item.masuk:item.keluar;
                const wrapper=document.createElement('div'); wrapper.className='history-item'; wrapper.style.flexDirection='column'; wrapper.style.alignItems='stretch';
                const row=document.createElement('div'); row.style.cssText='display:flex;justify-content:space-between;align-items:center;width:100%;';
                const info=document.createElement('div'); info.className='history-info'; info.innerHTML='<p></p><small></small>';
                info.querySelector('p').textContent=toProperCase(item.uraian); info.querySelector('small').textContent=item.tanggal;
                const amountEl=document.createElement('div'); amountEl.className='history-amount '+(isMasuk?'text-masuk':'text-keluar'); amountEl.textContent=(isMasuk?'+':'-')+formatRp(amount);

                const rightSide=document.createElement('div');
                rightSide.style.cssText='display:flex;align-items:center;justify-content:flex-end;flex-shrink:0;';
                rightSide.appendChild(amountEl);

                if(isBendahara && item.row && item.sheetName) {
                    const edit=document.createElement('button');
                    edit.type='button';
                    edit.className='history-edit-btn';
                    edit.innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20h9"></path><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L8 18l-4 1 1-4L16.5 3.5z"></path></svg>';
                    edit.title='Edit transaksi';
                    edit.setAttribute('aria-label','Edit transaksi');
                    edit.onclick=()=>openEditModal(item);
                    rightSide.appendChild(edit);
                }

                row.appendChild(info);
                row.appendChild(rightSide);
                wrapper.appendChild(row);
                listContainer.appendChild(wrapper);
            });
        }

        function openEditModal(item) {
            document.getElementById('editRow').value=item.row;
            document.getElementById('editSheet').value=item.sheetName;
            document.getElementById('editKategori').value=item.isMobil?'KAS MOBIL':'KAS PW';
            document.getElementById('editTanggal').value=item.tanggal;
            document.getElementById('editTanggalHint').textContent=item.isMobil?'Format: M/D/YYYY':'Format: DD/MM/YYYY (Hijriyah)';
            document.getElementById('editUraian').value=item.uraian.replace(/\s*\(Mobil\)\s*$/i,'');
            document.getElementById('editNominal').value=new Intl.NumberFormat('id-ID').format(Number(item.masuk||item.keluar||0));
            const jenis=Number(item.masuk)>0?'masuk':'keluar';
            document.querySelectorAll('input[name="editJenis"]').forEach(r=>r.checked=r.value===jenis);
            document.getElementById('editModal').style.display='flex';
        }
        function closeEditModal(e){if(e.target===document.getElementById('editModal'))document.getElementById('editModal').style.display='none';}
        function closeEditModalDirect(){document.getElementById('editModal').style.display='none';}

        let pendingDeleteItem = null;

        function openDeleteConfirm(item) {
            if((localStorage.getItem('iassRole')||'').toLowerCase()!=='bendahara') return;
            pendingDeleteItem = item;
            const nominal = Number(item.masuk || item.keluar || 0);
            document.getElementById('confirmDeleteMessage').textContent =
                toProperCase(item.uraian) + '\n' + item.tanggal + '\n' + formatRp(nominal);
            document.getElementById('confirmDeleteModal').style.display = 'flex';
        }

        function closeConfirmDelete(e) {
            const modal = document.getElementById('confirmDeleteModal');
            if(e && e.target !== modal) return;
            modal.style.display = 'none';
            pendingDeleteItem = null;
        }

        function deleteTransaction(item) {
            openDeleteConfirm(item);
        }

        document.getElementById('btnConfirmDelete').addEventListener('click', function() {
            if(!pendingDeleteItem) return;
            const item = pendingDeleteItem;
            pendingDeleteItem = null;
            document.getElementById('confirmDeleteModal').style.display = 'none';

            fetch(URL_APPS_SCRIPT,{
                method:'POST',
                body:JSON.stringify({action:'delete',sheetName:item.sheetName,row:Number(item.row)}),
                headers:{'Content-Type':'text/plain;charset=utf-8'}
            })
            .then(res=>res.json())
            .then(res=>{
                if(res.status==='success'){
                    showToast('✓ Transaksi berhasil dihapus.');
                    fetchData();
                }else{
                    showToast('Gagal menghapus: '+res.message, 'error');
                }
            })
            .catch(()=>showToast('Gagal terhubung.', 'error'));
        });

        document.getElementById('editForm').addEventListener('submit',function(e){
            e.preventDefault();
            if((localStorage.getItem('iassRole')||'').toLowerCase()!=='bendahara')return;
            const kategori=document.getElementById('editKategori').value, tanggal=document.getElementById('editTanggal').value.trim(), uraian=toProperCase(document.getElementById('editUraian').value.trim()), jenisEl=document.querySelector('input[name="editJenis"]:checked'), nominal=Number(document.getElementById('editNominal').value.replace(/\./g,''));
            if(!tanggal||!uraian||!jenisEl||!nominal||nominal<=0)return alert('Lengkapi data transaksi.');
            const btn=document.getElementById('btnUpdate');btn.textContent='Menyimpan...';btn.disabled=true;
            fetch(URL_APPS_SCRIPT,{method:'POST',body:JSON.stringify({action:'update',kategori:kategori,sheetName:document.getElementById('editSheet').value,row:Number(document.getElementById('editRow').value),tanggal:tanggal,uraian:uraian,jenis:jenisEl.value,nominal:nominal}),headers:{'Content-Type':'text/plain;charset=utf-8'}})
            .then(res=>res.json()).then(res=>{
                if(res.status==='success'){
                    closeEditModalDirect();
                    showToast('✓ Transaksi berhasil diperbarui.');
                    fetchData();
                }else{
                    showToast('Gagal memperbarui: '+res.message, 'error');
                }
            })
            .catch(()=>showToast('Gagal terhubung.', 'error'))
            .finally(()=>{btn.textContent='Simpan Perubahan';btn.disabled=false;});
        });
        document.getElementById('editNominal').addEventListener('input',function(){let val=this.value.replace(/\D/g,'');this.value=val?new Intl.NumberFormat('id-ID').format(val):'';});
        document.getElementById('btnDeleteFromEdit').addEventListener('click',function(){
            const item={row:Number(document.getElementById('editRow').value),sheetName:document.getElementById('editSheet').value,uraian:document.getElementById('editUraian').value,tanggal:document.getElementById('editTanggal').value,masuk:document.querySelector('input[name="editJenis"]:checked')?.value==='masuk'?Number(document.getElementById('editNominal').value.replace(/\./g,'')):0,keluar:document.querySelector('input[name="editJenis"]:checked')?.value==='keluar'?Number(document.getElementById('editNominal').value.replace(/\./g,'')):0};
            closeEditModalDirect(); openDeleteConfirm(item);
        });


        document.getElementById('kasForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const rawDateStr = document.getElementById('tanggal').value; 
            if (!rawDateStr) return alert('Pilih tanggal terlebih dahulu.');
            const isMobil = document.getElementById('cat_in').value === 'KAS MOBIL';
            let finalTanggalInput = "";
            
            if (isMobil) {
                const dateObj = new Date(rawDateStr);
                finalTanggalInput = `${String(dateObj.getMonth()+1)}/${String(dateObj.getDate())}/${dateObj.getFullYear()}`;
            } else {
                if (!tanggalHijriyahFinal) return alert('Gagal memformat tanggal Hijriyah.');
                finalTanggalInput = tanggalHijriyahFinal;
            }

            const rawNominal = document.getElementById('nominal').value.replace(/\./g, ''); const btn = document.getElementById('btnSimpan');
            const data = {
                action: 'insert', kategori: document.getElementById('cat_in').value, tanggal: finalTanggalInput, 
                uraian: toProperCase(document.getElementById('uraian').value), jenis: document.querySelector('input[name="jenis"]:checked').value, nominal: Number(rawNominal)
            };

            if (navigator.onLine) {
                btn.textContent = "Menyimpan..."; btn.disabled = true;
                fetch(URL_APPS_SCRIPT, { method: 'POST', body: JSON.stringify(data), headers: { 'Content-Type': 'text/plain;charset=utf-8' } })
                .then(res => res.json())
                .then(res => {
                    if (res.status === 'success') {
                        alert('Berhasil disimpan!');
                        document.getElementById('uraian').value = ""; document.getElementById('nominal').value = "";
                        document.querySelector('input[name="jenis"]:checked').checked = false;
                        fetchData();
                    } else { alert('Error: ' + res.message); }
                })
                .finally(() => { btn.textContent = "Simpan Transaksi"; btn.disabled = false; });
            }
        });

        window.addEventListener('online', () => { document.getElementById('statusJaringan').textContent = 'Online'; document.getElementById('statusJaringan').className = "status-online"; });
        window.addEventListener('offline', () => { document.getElementById('statusJaringan').textContent = 'Offline'; document.getElementById('statusJaringan').className = "status-offline"; });
        
        checkSession(); 
    </script>
</body>
</html>
